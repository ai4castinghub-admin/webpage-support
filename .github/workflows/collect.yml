name: Collect weekly banner candidates

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "America/Toronto"
  workflow_dispatch:
    inputs:
      manual_pho_title:
        description: "Optional official PHO headline (use all three manual fields)"
        required: false
        type: string
      manual_pho_url:
        description: "Optional official publichealthontario.ca news URL"
        required: false
        type: string
      manual_pho_date:
        description: "Optional publication timestamp, e.g. 2026-08-21T00:00:00Z"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: weekly-banner-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect candidates
        env:
          MANUAL_PHO_TITLE: ${{ inputs.manual_pho_title }}
          MANUAL_PHO_URL: ${{ inputs.manual_pho_url }}
          MANUAL_PHO_DATE: ${{ inputs.manual_pho_date }}
        run: python -m banner_pipeline.collect
      - name: Run parser tests
        run: pytest -q
      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/banner.yml data/candidates.lock.json; then
            echo "No reviewable changes were collected; no pull request is needed."
            exit 0
          fi
          branch="automation/banner-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/banner.yml data/candidates.lock.json
          git commit -m "Review weekly banner candidates"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review weekly banner candidates: $(date -u +%Y-%m-%d)" \
            --body-file .github/weekly-review-template.md
          gh workflow run validate.yml --ref "$branch"
