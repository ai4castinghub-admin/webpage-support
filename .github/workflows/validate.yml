name: Validate banner review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/banner.yml"
      - "data/candidates.lock.json"
      - "config/sources.yml"
      - "banner_pipeline/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Detect review data changes
        id: review_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^data/(banner\.yml|candidates\.lock\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require one to five approved items
        if: steps.review_changes.outputs.changed == 'true'
        run: python -m banner_pipeline.validate
