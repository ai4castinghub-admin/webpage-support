name: Publish approved banner to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/banner.yml"
      - "data/candidates.lock.json"
      - "banner_pipeline/build.py"
      - "banner_pipeline/page_template.html"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build approved self-contained page
        run: python -m banner_pipeline.build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy approved page
        id: deployment
        uses: actions/deploy-pages@v4
