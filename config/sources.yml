sources:
  - id: phac-public-health-updates
    name: Public Health Agency of Canada
    type: rss
    url: https://www.canada.ca/content/dam/phac-aspc/rss/new-eng.xml
    enabled: true
    allowed_hosts:
      - canada.ca
      - www.canada.ca

  - id: phac-media-room
    name: Public Health Agency of Canada
    type: rss
    # Current organization feed linked by Canada.ca's news subscription page.
    url: "https://api.io.canada.ca/io-server/gc/news/en/v2?atomtitle=Public+Health+Agency+of+Canada&dept=publichealthagencyofcanada&format=atom&orderBy=desc&pick=50&publishedDate%3E=2021-07-23&sort=publishedDate"
    enabled: true
    allowed_hosts:
      - canada.ca
      - www.canada.ca

  - id: pho-news
    name: Public Health Ontario
    type: pho_html
    url: https://www.publichealthontario.ca/en/About/News
    enabled: true
    allowed_hosts:
      - publichealthontario.ca
      - www.publichealthontario.ca

  - id: cbc-health
    name: CBC News
    type: rss
    # CBC's public Health RSS feed; article links resolve under cbc.ca/news.
    url: https://www.cbc.ca/cmlink/rss-health
    enabled: true
    allowed_hosts:
      - cbc.ca
      - www.cbc.ca
    topic_rules:
      # Respiratory-virus activity and related surveillance.
      - any:
          - respiratory virus
          - respiratory illness
          - influenza
          - flu season
          - avian flu
          - bird flu
          - h5n1
          - rsv
          - respiratory syncytial virus
          - covid
          - coronavirus
          - sars-cov-2
          - measles
          - wastewater surveillance
      # Pharmaceutical availability, production, and supply chains.
      - all:
          - [pharmaceutical, drug, medicine, medication, vaccine]
          - [supply chain, shortage, availability, stockpile, manufacturing, production]
      # Research models for outbreaks, transmission, and surveillance.
      - all:
          - [model, modelling, modeling, forecast, prediction, nowcast, digital twin]
          - [outbreak, epidemic, pandemic, transmission, respiratory, influenza, flu, rsv, covid, virus, disease, wastewater]

  # Replace example.org with the website URL, then set enabled to true.
  - id: own-blog
    name: Our Blog
    type: wordpress
    url: https://example.org/wp-json/wp/v2/posts
    enabled: false
    allowed_hosts:
      - example.org
